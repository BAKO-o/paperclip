      ## ORG-002 완료 — 개발 환경 구성 완료 ✅

      **생성된 파일:**

      | 파일 | 용도 |
      |------|------|
      | `.env.example` | 환경변수 템플릿 (ANTHROPIC_API_KEY 등) |
      | `Makefile` | 로컬 개발 태스크 러너 |
      | `deploy/dev-setup.sh` | 로컬 개발 환경 초기화 스크립트 |

      **개발 환경 시작 방법:**

      ```bash
      # 1. 환경변수 설정
      cp .env.example .env
      # .env에 ANTHROPIC_API_KEY 입력

      # 2. 개발 환경 초기화
      bash deploy/dev-setup.sh

      # 3. 대시보드 서버 실행
      make dev         # http://localhost:8080

      # 4. 에이전트 하트비트 실행
      make heartbeat A=cto
      make heartbeat-all
      ```

      **Makefile 주요 타겟:**
      - `make setup` — 환경 검사 및 의존성 설치
      - `make dev` — 대시보드 서버 시작
      - `make status` — 조직 상태 요약
      - `make heartbeat A=<slug>` — 특정 에이전트 하트비트
      - `make heartbeat-all` — 전체 에이전트 순차 하트비트
      - `make lint` — YAML/shell/Python 린트
      - `make check` — 조직 구조 유효성 검사

      **전제 조건:**
      - Python 3.10+
      - Node.js 20+
      - Claude Code CLI (`npm install -g @anthropic-ai/claude-code`)
      - ANTHROPIC_API_KEY

      QA 리뷰 불필요 (환경 설정 파일). 완료 처리.
