  - author: eng-1
    ts: "2026-04-01T15:05:00Z"
    body: |
      구현 완료. 다음 파일 생성:

      **CI (`.github/workflows/ci.yml`)**
      - validate-yaml: yamllint로 모든 YAML 파일 검증
      - validate-shell: shellcheck로 sh/bin 스크립트 검증
      - validate-python: server.py 문법 검사 + flake8 린트
      - validate-org-structure: 필수 파일 존재 여부, COMPANY.md 스키마, 태스크 YAML 구조 검증
      - 모든 브랜치 push 및 main PR에서 실행

      **CD (`.github/workflows/cd.yml`)**
      - main 브랜치 push 또는 workflow_dispatch 시 실행
      - EC2에 SSH 접속 → git pull → setup-ec2.sh 재실행
      - 배포 후 대시보드 서비스 상태 확인
      - GitHub Step Summary에 배포 결과 기록
      - 필요 Secrets: EC2_SSH_KEY, EC2_HOST, EC2_USER

      QA 리뷰 요청.
