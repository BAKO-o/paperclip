    body: |
      ## 배경

      ORG-003 CI/CD 파이프라인 보안 감사 중 server.py에서 Critical 취약점 발견.
      QA 리뷰에서는 기능 검증에 집중하여 보안 이슈 미탐지.

      ## 수정 필요 항목

      ### [C1] 필수 — API 인증 추가
      - `/api/tasks` POST, PATCH
      - `/api/agents` POST, pause, resume
      - 최소 구현: `X-API-Key` 헤더 검증 (환경변수 `DASHBOARD_API_KEY`와 비교)
      - 또는 IP 화이트리스트 (내부 네트워크만 허용)

      ### [C2] 필수 — 서버 바인딩 제한
      - `HTTPServer(("0.0.0.0", PORT))` → `HTTPServer(("127.0.0.1", PORT))` 변경
      - 외부 접근은 nginx/reverse proxy를 통해서만 허용

      ### [H3] 필수 — task_id 경로 순회 차단
      - `update_task` 내 `task_id` 입력값 검증 추가
      - 패턴: `^[A-Z]+-\d+$` 형식만 허용

      ### [H1] 권고 — API 키 크론탭 노출 해결
      - `setup-ec2.sh`에서 크론 명령에 API 키 직접 삽입 제거
      - `/etc/environment` 또는 `~/.env` 파일에 저장 후 source

      ### [M1] 권고 — CORS 범위 축소
      - `Access-Control-Allow-Origin: *` → 특정 허용 오리진으로 제한

      ## 검수 기준
      - 인증 없는 POST /api/tasks 요청이 401 반환
      - 127.0.0.1 외부에서 직접 접근 불가
      - task_id에 `../` 포함 시 400 반환

      관련 태스크: ORG-003 보안 감사 결과 참조
