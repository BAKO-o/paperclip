name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate-yaml:
    name: Validate YAML Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            $(find . -name "*.yaml" -o -name "*.yml" | grep -v ".github" | grep -v "node_modules" | head -50)

  validate-shell:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          find . -name "*.sh" -not -path "./node_modules/*" | xargs shellcheck --severity=warning || true
          find bin/ -type f -not -name "*.py" | xargs shellcheck --severity=warning || true

  validate-python:
    name: Validate Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile server.py && echo "server.py syntax OK"

      - name: Install and run flake8
        run: |
          pip install flake8
          flake8 server.py --max-line-length=120 --ignore=E501,W503 || true

  validate-org-structure:
    name: Validate Org Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required_files=(
            "COMPANY.md"
            "server.py"
            "deploy/setup-ec2.sh"
            "state/activity.jsonl"
            "state/budgets.yaml"
            "state/counter.yaml"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            else
              echo "OK: $f"
            fi
          done

      - name: Check COMPANY.md schema
        run: |
          python3 -c "
          import re, sys
          content = open('COMPANY.md').read()
          assert 'schema: agentcompanies/v1' in content, 'Missing schema field'
          assert 'slug:' in content, 'Missing slug field'
          assert 'name:' in content, 'Missing name field'
          print('COMPANY.md schema OK')
          "

      - name: Validate task YAML structure
        run: |
          python3 -c "
          import yaml, os, sys
          tasks_dir = 'state/tasks'
          required_fields = ['id', 'title', 'status', 'priority', 'assignee']
          valid_statuses = ['todo', 'in_progress', 'in_review', 'blocked', 'done']
          errors = []
          for fname in os.listdir(tasks_dir):
            if not fname.endswith('.yaml'):
              continue
            path = os.path.join(tasks_dir, fname)
            with open(path) as f:
              data = yaml.safe_load(f)
            for field in required_fields:
              if field not in data:
                errors.append(f'{fname}: missing field \"{field}\"')
            if data.get('status') not in valid_statuses:
              errors.append(f'{fname}: invalid status \"{data.get(\"status\")}\"')
          if errors:
            for e in errors:
              print('ERROR:', e)
            sys.exit(1)
          print(f'All {len(os.listdir(tasks_dir))} task files valid')
          "
